<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Hub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">

    <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

    <!-- barra di ricerca -->
    <header class="hero sticky-top d-flex flex-column justify-content-center text-center text-white px-3">
        <button type="button" id="theme-toggle" class="btn btn-sm btn-outline-light position-absolute top-0 end-0 m-3"
            aria-label="Attiva tema scuro">🌙</button>

        <h1 class="fw-bold mb-3">SportsHub</h1>
        <p class="mb-4">Cerca una squadra, scopri prossime partite e ultimi risultati.</p>

        <form id="search-form" class="hero-form d-flex gap-2 mx-auto" role="search" autocomplete="off">
            <label for="search-input" class="visually-hidden">Nome della squadra</label>
            <input type="search" id="search-input" class="form-control" placeholder="Es. Arsenal" minlength="3"
                required>
            <button type="submit" class="btn btn-light fw-bold text-navy px-4">Cerca</button>
        </form>
    </header>

    <main class="container main-wrapper py-5">

        <!-- Risultati della ricerca (compaiono subito sotto la barra) -->
        <section id="results-section" class="mb-5" aria-label="Risultati della ricerca">
            <div id="results-status"></div>
            <div id="results-row" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 cards-row"></div>
        </section>

        <!-- Preferiti -->
        <section id="favorites-section" class="mb-5" aria-labelledby="favorites-title">
            <h2 id="favorites-title" class="section-title h4 mb-3">
                ⭐ Le tue squadre preferite <span id="favorites-count" class="text-body-secondary"></span>
            </h2>
            <div id="favorites-filters" class="d-flex flex-wrap gap-2 mb-3" hidden></div>
            <p id="favorites-empty" class="text-body-secondary fst-italic">
                Non hai ancora squadre preferite: cercane una e aggiungila!
            </p>
            <div id="favorites-row" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3 cards-row"></div>
        </section>

        <!-- Prossimi appuntamenti delle preferite -->
        <section id="upcoming-section" class="mb-5" aria-labelledby="upcoming-title">
            <h2 id="upcoming-title" class="section-title h4 mb-3">📅 Prossimi appuntamenti</h2>
            <div id="upcoming-list"></div>
        </section>

    </main>

    <!-- footer -->
    <footer class="site-footer text-white text-center py-4 px-3">
        <p class="fw-semibold mb-3">Seguici sui social</p>
        <ul class="list-unstyled d-flex justify-content-center gap-3 mb-3">
            <li>
                <a href="#"
                    class="social-link d-inline-flex align-items-center justify-content-center rounded-circle text-white text-decoration-none"
                    aria-label="Instagram"><i class="bi bi-instagram" aria-hidden="true"></i></a>
            </li>
            <li>
                <a href="#"
                    class="social-link d-inline-flex align-items-center justify-content-center rounded-circle text-white text-decoration-none"
                    aria-label="Facebook"><i class="bi bi-facebook" aria-hidden="true"></i></a>
            </li>
            <li>
                <a href="#"
                    class="social-link d-inline-flex align-items-center justify-content-center rounded-circle text-white text-decoration-none"
                    aria-label="X"><i class="bi bi-twitter-x" aria-hidden="true"></i></a>
            </li>
        </ul>
        <p class="small mb-0">© 2026 SportsHub · Dati forniti da TheSportsDB</p>
    </footer>

    <!-- bottone torna su -->
    <a href="#"
        class="back-to-top nascosto btn btn-primary rounded-circle shadow position-fixed bottom-0 end-0 m-4 d-inline-flex align-items-center justify-content-center"
        aria-label="Torna all'inizio della pagina"><i class="bi bi-arrow-up" aria-hidden="true"></i></a>

    <!-- toast per aggiunta o eliminazione squadra -->
    <div class="toast-container position-fixed bottom-0 start-0 p-3">
        <div id="app-toast" class="toast align-items-center text-bg-dark border-0" role="status" aria-live="polite"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="app-toast-text"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                    aria-label="Chiudi"></button>
            </div>
        </div>
    </div>

    <!-- modale dettagli squadra -->
    <div class="modal fade" id="team-modal" tabindex="-1" aria-labelledby="team-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="team-modal-title">Dettagli squadra</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
                </div>
                <div class="modal-body" id="team-modal-body"></div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
        integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
        crossorigin="anonymous"></script>

    <script type="module" src="assets/js/main.js"></script>
</body>

</html>
